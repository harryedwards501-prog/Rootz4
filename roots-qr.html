<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f8f6f2;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 36px 40px;
    text-align: center;
    box-shadow: 0 4px 40px rgba(0,0,0,0.12);
    max-width: 340px;
    width: 100%;
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    overflow: hidden;
    margin: 0 auto 10px;
    box-shadow: 0 2px 12px rgba(46,107,54,0.25);
  }
  .icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .app-name {
    font-size: 1.6rem;
    font-weight: 800;
    color: #2e6b36;
    letter-spacing: -0.03em;
    margin-bottom: 3px;
  }
  .tagline {
    font-size: 0.82rem;
    color: #888;
    margin-bottom: 24px;
    line-height: 1.4;
  }
  .qr-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 24px;
    position: relative;
  }
  #qrcode canvas, #qrcode img {
    border-radius: 8px;
    display: block;
  }
  .divider {
    height: 1px;
    background: #f0ece6;
    margin: 20px 0;
  }
  .instruction {
    font-size: 0.95rem;
    font-weight: 700;
    color: #333;
    margin-bottom: 6px;
  }
  .sub {
    font-size: 0.78rem;
    color: #999;
    line-height: 1.6;
  }
  .amicus {
    font-size: 0.75rem;
    color: #bbb;
    margin-top: 18px;
  }
  .amicus strong { color: #2e6b36; }
  @media print {
    body { background: white; min-height: unset; }
    .card { box-shadow: none; border: 1px solid #e0e0e0; margin: 20px auto; }
  }
</style>
</head>
